olor:#596f4c}.status-dot{display:inline-block;width:5px;height:5px;background:#7b9960;border-radius:50%;margin:0 7px 2px 14px}.inspector{display:flex;align-items:center;gap:15px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-top:14px}.selection-title{min-width:0;flex:1}.selection-title h3{font-size:16px;margin:0 0 6px}.selection-title p{font-size:12px;line-height:1.6;color:#7d8975;margin:0;max-width:430px}.position-fields{display:flex;align-items:flex-end;gap:8px;margin-left:auto}.position-fields label{font-size:11px;color:#6d7d63;width:66px}.position-fields input{font-size:14px;padding:8px}.position-fields button{font-size:12px;height:36px}#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(25px);opacity:0;pointer-events:none;transition:.2s;z-index:10;background:#203f32;color:white;border:1px solid #75956b;padding:13px 22px;border-radius:8px;max-width:90vw;box-shadow:0 5px 20px #0003}#toast.show{opacity:1;transform:translateX(-50%)}#loading{position:absolute;inset:0;display:grid;place-items:center;color:#e1e7d9;background:#263e31}dialog{border:1px solid #c4d1bc;border-radius:12px;color:#2d4635;max-width:590px;width:90vw;padding:30px;line-height:1.8}dialog::backdrop{background:#12271999}dialog h2{font-size:21px;margin:0 0 18px}.dialog-close{position:absolute;top:8px;right:8px;font-size:24px}code{font-family:ui-monospace,monospace;background:#eff3e8;border-radius:4px;padding:2px 5px;font-size:12px}.file-path{display:block;padding:14px;overflow-wrap:anywhere}

<body>
<header><h1>Farm x N</h1><nav><button id="language" lang="en" title="Switch to English">EN</button><button id="help" data-i18n="ui.help">使用说明</button><button id="export-tmx" class="primary"><span data-i18n="ui.export">导出 TMX</span> <span aria-hidden="true">↗</span></button></nav></header>
<main>
<aside>
 <section><h2 data-i18n="dims.title">地图尺寸</h2><div class="dimension-inputs"><label><span data-i18n="dims.width">宽度</span> <span class="unit" data-i18n="unit.tiles">格</span><input id="width" type="number" min="80" step="1" value="160"></label><span class="times">×</span><label><span data-i18n="dims.height">高度</span> <span class="unit" data-i18n="unit.tiles">格</span><input id="height" type="number" min="65" step="1" value="130"></label></div><div class="presets"><button data-size="80,65">80 × 65</button><button data-size="160,130" class="active">160 × 130</button><button data-size="320,260">320 × 260</button></div><label class="performance-label" for="performance"><span data-i18n="perf.label">电脑性能</span><select id="performance"><option value="auto" data-i18n="perf.auto">自动推荐</option><option value="light" data-i18n="perf.light">轻量 · 低内存设备</option><option value="balanced" data-i18n="perf.balanced">标准 · 日常电脑</option><option value="high" data-i18n="perf.high">高性能 · 内存充足</option></select></label><p id="performance-note" class="size-limit"></p><button id="resize" class="outline full" data-i18n="dims.apply">应用尺寸</button><p class="size-limit" id="size-limit"></p><div class="area-line"><span><strong id="area">20,800</strong> <span data-i18n="unit.tiles">格</span></span><span id="ratio" data-i18n-title="ratio.title">Farm x 4</span></div></section>
 <section class="layout-section"><h2 data-i18n="layout.title">布局</h2><div class="layout-actions"><button id="layout-import" class="outline" data-i18n="layout.import">导入…</button><button id="layout-export" class="outline" data-i18n="layout.export">导出 JSON</button><button id="layout-reset" class="outline" data-i18n="layout.reset">重置</button></div><input id="layout-file" type="file" accept=".json,.tmx,application/json,text/xml,application/xml" hidden><p class="size-limit" data-i18n="layout.hint"></p></section>
 <section class="features-section"><h2 data-i18n="features.title">设施与出口</h2><div id="feature-list"></div></section>
</aside>
<div class="workspace">
 <div class="workspace-bar"><strong data-i18n="workspace.title">地图</strong><div class="view-options"><label><input id="grid" type="checkbox"> <span data-i18n="view.grid">网格</span></label><label><input id="labels" type="checkbox" checked> <span data-i18n="view.labels">点位</span></label><button id="undo" data-i18n-title="undo.title" disabled>↶ <span data-i18n="undo">撤销</span></button><button id="redo" data-i18n-title="redo.title" disabled>↷ <span data-i18n="redo">重做</span></button><button id="fit" data-i18n="view.fit">适应画布</button></div></div>
 <div id="map-viewport" tabindex="0" data-i18n-aria="viewport.aria"><canvas id="map"></canvas><div class="zoom-controls"><button id="zoom-out" data-i18n-aria="zoom.out">−</button><span id="zoom-value">100%</span><button id="zoom-in" data-i18n-aria="zoom.in">+</button></div><div id="loading" data-i18n="load.loading">正在载入地图…</div></div>
 <div class="statusbar"><span id="coordinates"></span><span><strong id="dimensions">160 × 130</strong><span class="status-dot"></span><span data-i18n="status.ok">通行检查通过</span></span></div>
 <div class="inspector"><div class="selection-title"><h3 id="selected-name" data-i18n="feature.Greenhouse.name">温室</h3><p id="selected-note"></p></div><div class="position-fields"><label>X<input id="pos-x" type="number" value="25" min="0"></label><label>Y<input id="pos-y" type="number" value="10" min="0"></label><button id="move" class="primary" data-i18n="pos.apply">应用位置</button><button id="restore" data-i18n="pos.restore" data-i18n-title="pos.restoreTitle">恢复原位</button></div></div>
</div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="help-dialog"><button id="close-help" class="dialog-close" data-i18n-aria="dialog.close">×</button><h2 data-i18n="help.title">TMX 放置位置</h2><p data-i18n-html="help.body">将导出的 <code>Farm.tmx</code> 放入地图加载模组目录，替换同名文件：</p><code class="file-path">Stardew Valley/Mods/[CP] FarmxN/assets/Farm.tmx</code><p class="help-keys" data-i18n="help.keys"></p></dialog>
