<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm x N</title><meta name="description" content="调整农场地图尺寸与设施位置，导出 TMX。"><link rel="stylesheet" href="style.css?v=farmxn-ui"></head>
<body>
<header><h1>Farm x N</h1><nav><button id="help">使用说明</button><button id="export-tmx" class="primary">导出 TMX <span aria-hidden="true">↗</span></button></nav></header>
<main>
<aside>
 <section><h2>地图尺寸</h2><div class="dimension-inputs"><label>宽度 <span>格</span><input id="width" type="number" min="80" step="1" value="160"></label><span class="times">×</span><label>高度 <span>格</span><input id="height" type="number" min="65" step="1" value="130"></label></div><div class="presets"><button data-size="80,65">80 × 65</button><button data-size="160,130" class="active">160 × 130</button><button data-size="320,260">320 × 260</button></div><label class="performance-label" for="performance">电脑性能<select id="performance"><option value="auto">自动推荐</option><option value="light">轻量 · 低内存设备</option><option value="balanced">标准 · 日常电脑</option><option value="high">高性能 · 内存充足</option></select></label><p id="performance-note" class="size-limit"></p><button id="resize" class="outline full">应用尺寸</button><p class="size-limit" id="size-limit">最小 80 × 65 · 最多 262,144 格</p><div class="area-line"><span><strong id="area">20,800</strong> 格</span><span id="ratio" title="总地图面积 ÷ 原版 80 × 65；不是可耕种面积">Farm x 4</span></div></section>
 <section class="features-section"><h2>设施与出口</h2><div id="feature-list"></div></section>
</aside>
<div class="workspace">
 <div class="workspace-bar"><strong>地图</strong><div class="view-options"><label><input id="grid" type="checkbox"> 网格</label><label><input id="labels" type="checkbox" checked> 点位</label><button id="undo" title="撤销 Ctrl / ⌘ Z" disabled>↶ 撤销</button><button id="fit">适应画布</button></div></div>
 <div id="map-viewport" tabindex="0" aria-label="农场地图，可拖动点位，滚轮缩放，空白处拖动平移"><canvas id="map"></canvas><div class="zoom-controls"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-value">100%</span><button id="zoom-in" aria-label="放大">+</button></div><div id="loading">正在载入地图…</div></div>
 <div class="statusbar"><span id="coordinates">拖动平移 · 滚轮缩放</span><span><strong id="dimensions">160 × 130</strong><span class="status-dot"></span>通行检查通过</span></div>
 <div class="inspector"><div class="selection-title"><h3 id="selected-name">温室</h3><p id="selected-note"></p></div><div class="position-fields"><label>X<input id="pos-x" type="number" value="25" min="0"></label><label>Y<input id="pos-y" type="number" value="10" min="0"></label><button id="move" class="primary">应用位置</button><button id="restore" title="恢复选中设施的原版位置">恢复原位</button></div></div>
</div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="help-dialog"><button id="close-help" class="dialog-close" aria-label="关闭">×</button><h2>TMX 放置位置</h2><p>将导出的 <code>Farm.tmx</code> 放入地图加载模组目录，替换同名文件：</p><code class="file-path">Stardew Valley/Mods/[CP] FarmxN/assets/Farm.tmx</code></dialog>
<script type="module" src="app.mjs?v=farmxn-ui"></script></body></html>
