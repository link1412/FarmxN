<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm x N</title><meta name="description" content="调整农场地图尺寸与设施位置，导出 TMX。"><link rel="stylesheet" href="style.css?v=farmxn-ui"></head>
<body>
<header><h1>Farm x N</h1><nav><button id="language" lang="en" title="Switch to English">EN</button><button id="help" data-i18n="ui.help">使用说明</button><button id="export-tmx" class="primary"><span data-i18n="ui.export">导出 TMX</span> <span aria-hidden="true">↗</span></button></nav></header>
<main>
<aside>
 <section><h2 data-i18n="dims.title">地图尺寸</h2><div class="dimension-inputs"><label><span data-i18n="dims.width">宽度</span> <span class="unit" data-i18n="unit.tiles">格</span><input id="width" type="number" min="80" max="4096" step="1" value="160"></label><span class="times">×</span><label><span data-i18n="dims.height">高度</span> <span class="unit" data-i18n="unit.tiles">格</span><input id="height" type="number" min="65" max="4096" step="1" value="130"></label></div><div class="presets"><button data-size="80,65">80 × 65</button><button data-size="160,130">160 × 130</button><button data-size="320,260">320 × 260</button><button data-size="2048,2048">2048 × 2048</button><button data-size="4096,4096">4096 × 4096</button></div><button id="resize" class="outline full" data-i18n="dims.apply">应用尺寸</button><p class="size-limit" id="size-limit"></p><p class="size-limit size-note" id="size-note" hidden></p><div class="area-line"><span><strong id="area">20,800</strong> <span data-i18n="unit.tiles">格</span></span><span id="ratio" data-i18n-title="ratio.title">Farm x 4</span></div></section>
 <section class="features-section"><h2 data-i18n="features.title">设施与出口</h2><div id="feature-list"></div></section>
</aside>
<div class="workspace">
 <div class="workspace-bar"><strong data-i18n="workspace.title">地图</strong><div class="view-options"><label><input id="grid" type="checkbox"> <span data-i18n="view.grid">网格</span></label><label><input id="labels" type="checkbox" checked> <span data-i18n="view.labels">点位</span></label><button id="undo" data-i18n-title="undo.title" disabled>↶ <span data-i18n="undo">撤销</span></button><button id="redo" data-i18n-title="redo.title" disabled>↷ <span data-i18n="redo">重做</span></button><button id="fit" data-i18n="view.fit">适应画布</button></div></div>
 <div id="map-viewport" tabindex="0" data-i18n-aria="viewport.aria"><canvas id="map"></canvas><div class="zoom-controls"><button id="zoom-out" data-i18n-aria="zoom.out">−</button><span id="zoom-value">100%</span><button id="zoom-in" data-i18n-aria="zoom.in">+</button></div><div id="loading" data-i18n="load.loading">正在载入地图…</div></div>
 <div class="statusbar"><span id="coordinates"></span><span><strong id="dimensions">160 × 130</strong><span class="status-dot"></span><span data-i18n="status.ok">通行检查通过</span></span></div>
 <div class="inspector"><div class="selection-title"><h3 id="selected-name" data-i18n="feature.Greenhouse.name">温室</h3><p id="selected-note"></p></div><div class="position-fields"><label>X<input id="pos-x" type="number" value="25" min="0"></label><label>Y<input id="pos-y" type="number" value="10" min="0"></label><button id="move" class="primary" data-i18n="pos.apply">应用位置</button><button id="restore" data-i18n="pos.restore" data-i18n-title="pos.restoreTitle">恢复原位</button></div></div>
</div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="help-dialog"><button id="close-help" class="dialog-close" data-i18n-aria="dialog.close">×</button><h2 data-i18n="help.title">TMX 放置位置</h2><p data-i18n-html="help.body">将导出的 <code>Farm.tmx</code> 放入地图加载模组目录，替换同名文件：</p><code class="file-path">Stardew Valley/Mods/[CP] FarmxN/assets/Farm.tmx</code><p class="help-keys" data-i18n="help.keys"></p></dialog>
<script type="module" src="app.mjs?v=farmxn-ui"></script></body></html>
